name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  shared:
    name: Shared Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build --workspaces --if-present

  web:
    name: Web App
    needs: [shared]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ui/dist --project-name=fitmentor

  api:
    name: Go API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: api/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...

  ws:
    name: Gleam WS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.17.0"
      - run: gleam build
      - run: gleam check

  deploy:
    name: Deploy backend to EC2
    needs: [shared, web, api, ws]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-south-2
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Discover prod instance
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters 'Name=tag:Name,Values=fitmentor-prod' 'Name=instance-state-name,Values=running' \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "fitmentor-prod instance not found" >&2
            exit 1
          fi
          echo "instance-id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
      - name: Deploy over SSM
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance-id }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "fitmentor deploy ${{ github.sha }}" \
            --parameters '{"commands":["set -e","cd /opt/fitmentor","if [ ! -d .git ]; then git init -q; git remote add origin https://github.com/idk4whatamiusing/FitMentor.git; fi","git fetch origin main","git reset --hard origin/main","sed -i \"s|apps/api/Dockerfile|api/Dockerfile|; s|context: apps/ws|context: realtime|\" docker-compose.prod.yml","docker compose -f docker-compose.prod.yml build api ws planner","docker compose -f docker-compose.prod.yml up -d","for i in $(seq 1 36); do if curl -sf http://localhost:3000/v1/health; then echo; echo DEPLOY_OK; exit 0; fi; sleep 10; done","echo DEPLOY_HEALTHCHECK_FAILED","docker compose -f docker-compose.prod.yml logs --tail=50 api","exit 1"]}' \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $COMMAND_ID"
          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo InProgress)
            case "$STATUS" in
              Success)
                echo "--- deploy output ---"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query StandardOutputContent --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "--- deploy failed: $STATUS ---"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query StandardOutputContent --output text
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query StandardErrorContent --output text
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done
          echo "timed out waiting for SSM command" >&2
          exit 1
