name: Build Tauri APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/build-tauri.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android (arm64)
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Install SDK 36 and NDK 27
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Install JS dependencies
        run: npm ci

      - name: Build mobile SPA
        run: npm --workspace ui run build:mobile

      - name: Initialize Android project
        working-directory: ui
        run: npx tauri android init --ci

      - name: Build release APK
        working-directory: ui
        run: npx tauri android build --apk --target aarch64

      - name: Sign APK
        if: env.HAS_RELEASE_KEYSTORE == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/fitmentor-release.p12"
          APK=$(find ui/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          test -n "$APK"
          echo "Signing $APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/fitmentor-release.p12" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --out "$RUNNER_TEMP/FitMentor.apk" \
            "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FitMentor-Tauri-APK
          path: ${{ runner.temp }}/FitMentor.apk
          if-no-files-found: error
