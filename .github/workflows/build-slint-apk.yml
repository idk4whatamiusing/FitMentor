name: Build Slint APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/slint/**"
      - ".github/workflows/build-slint-apk.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Slint Android (arm64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/slint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Install NDK r30
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/slint

      - name: Install cargo-apk2
        run: cargo install cargo-apk2 --locked

      - name: Decode release keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/fitmentor-release.p12"

      - name: Build APK (release-signed)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          CARGO_APK_RELEASE_KEYSTORE: ${{ runner.temp }}/fitmentor-release.p12
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FITMENTOR_GOOGLE_CLIENT_ID: ${{ secrets.FITMENTOR_GOOGLE_CLIENT_ID }}
        run: cargo apk2 build --target aarch64-linux-android --lib --release

      - name: Build APK (debug-signed fallback)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        env:
          FITMENTOR_GOOGLE_CLIENT_ID: ${{ secrets.FITMENTOR_GOOGLE_CLIENT_ID }}
        run: cargo apk2 build --target aarch64-linux-android --lib

      - name: Upload release APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: FitMentor-Slint-APK
          path: apps/slint/target/release/apk/*.apk
          if-no-files-found: error

      - name: Upload debug APK
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: FitMentor-Slint-APK-debug
          path: apps/slint/target/debug/apk/*.apk
          if-no-files-found: error
