[package]
name = "fitmentor-mobile"
version = "0.1.0"
description = "FitMentor native shell"
authors = ["FitMentor"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# Keep `app_lib`: the generated Android MainActivity loads this library by name.
[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2"
