[package]
name = "fitmentor-slint"
version = "0.1.0"
edition = "2021"

[lib]
name = "fitmentor_slint"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "fitmentor-slint"
path = "src/main.rs"

[dependencies]
slint = { version = "1.19.0", features = ["backend-android-activity-06"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }

[build-dependencies]
slint-build = "1.19.0"

[package.metadata.android]
package = "ai.fitmentor.app"
label = "FitMentor"

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "fitmentor_slint"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN", "android.intent.action.VIEW"]
categories = ["android.intent.category.LAUNCHER"]

[profile.release]
codegen-units = 1
lto = true
