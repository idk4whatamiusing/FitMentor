services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    image: ghcr.io/idk4whatamiusing/fitmentor-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379
      INGEST_URL: http://ws:8080
      PORT: "3000"
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://fitmentor-7lx.pages.dev}
      API_SHARED_SECRET: ${API_SHARED_SECRET:-}
      APP_URL: ${APP_URL:-https://fitmentor-7lx.pages.dev}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_PREMIUM_PRODUCT_ID: ${POLAR_PREMIUM_PRODUCT_ID:-}
      POLAR_PREMIUM_PRICE_ID: ${POLAR_PREMIUM_PRICE_ID:-}
      POLAR_PRO_PRODUCT_ID: ${POLAR_PRO_PRODUCT_ID:-}
      POLAR_PRO_PRICE_ID: ${POLAR_PRO_PRICE_ID:-}
      PLANNER_URL: ${PLANNER_URL:-http://planner:8002}
    depends_on:
      - redis

  ws:
    image: ghcr.io/idk4whatamiusing/fitmentor-ws:${IMAGE_TAG:-latest}
    build:
      context: realtime
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379
      SUPERMEMORY_API_KEY: ${SUPERMEMORY_API_KEY:-}

  planner:
    image: ghcr.io/idk4whatamiusing/fitmentor-planner:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: microservices/daily-planner/Dockerfile
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://fitmentor:fitmentor@postgres:5432/fitmentor}
      REDIS_URL: redis://redis:6379
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      PORT: "8002"
      MODE: "http"

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle
    ports:
      - "3001:3001"
    command: ["start", "--addresses=0.0.0.0:3001", "--format", "0", "/data/0_0.tigerbeetle"]
    volumes:
      - tbdata:/data

volumes:
  tbdata:
