name = "fitmentor-api"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "worker-build --release"

[[d1_databases]]
binding = "DB"
database_name = "fitmentor"
database_id = "a9e67b8f-c079-4063-a7db-7812be16a16f"

[[kv_namespaces]]
binding = "SESSIONS"
id = "c365fd20f0a9408899b3a01024529941"

[observability]
enabled = true

[vars]
AI_WORKER_URL = "https://fitmentor-ey9.pages.dev/api/ai/complete"

[triggers]
crons = ["30 0 * * *"]
